[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-parser-pipeline"
version = "0.6.0"
description = "Observable multi-format document parsing pipeline for enterprise RAG systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "filelock>=3.13.0",
  "openpyxl>=3.1.0",
  "pdfplumber>=0.11.0",
  "pypdfium2>=4.30.0",
  "python-docx>=1.1.0",
  "python-pptx>=0.6.23",
  "requests>=2.32.0",
]

[project.scripts]
document-parser = "document_parser.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
]
web = [
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"document_parser.web" = ["static/**/*"]
